<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Engine Stats</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    table {
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
    }
    .home-container{
      display: flex;
      justify-content: end;
      margin: 10px 0 20px
    }
  </style>
</head>
<body>
  <h1>Search Engine Stats</h1>
  <div class="home-container">
      <a class="home-link" href="/">Go to home page</a>
  </div>
  <div id="stats"></div>
  <script>

    async function fetchStats() {
      try {
        const response = await fetch("/api/stats"); 
        const data = await response.json();

        const container = document.getElementById("stats");
        container.innerHTML = `
          <p>Total Pages Indexed: ${data.total_pages}</p>
        `;

        // Build a table for domain counts
        if (data.domain_counts && data.domain_counts.length > 0) {
          let html = "<table><tr><th>Domain</th><th>Count</th></tr>";
          data.domain_counts.forEach(item => {
            html += `<tr><td>${item.domain}</td><td>${item.count}</td></tr>`;
          });
          html += "</table>";
          container.innerHTML += html;
        } else {
          container.innerHTML += "<p>No domain data available.</p>";
        }
      } catch (err) {
        console.error("Error fetching stats:", err);
      }
    }

    fetchStats();
  </script>
</body>
</html>
