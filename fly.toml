# fly.toml app configuration file generated for mini-search-engine on 2025-01-06T00:39:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mini-search-engine'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
